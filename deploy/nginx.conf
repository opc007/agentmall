# ============================================================
# AgentMall · nginx 反向代理配置
# ============================================================
# 放置位置（重要）：
#   cp deploy/nginx.conf /etc/nginx/conf.d/agentmall.conf
#   nginx -t && systemctl reload nginx
#
# 为什么放 conf.d 而不是 sites-enabled/default：
#   本文件里有 upstream{} 和 map{}，它们只能在 http{} 上下文里出现。
#   conf.d/*.conf 是被 http{} include 的，sites-enabled/* 是被 http{} 里
#   单独 include 的 server 级上下文，放进去 nginx -t 直接报
#   "upstream directive is not allowed here"。
#
# 前置条件：
#   1) 三个后端进程已在本机跑起来（127.0.0.1:8000 / 8001 / 8002）；
#   2) 证书已签发（certbot / 云厂商证书均可），把下面 server :443 里的
#      ssl_certificate 两行换成真实路径；
#   3) /etc/nginx/.htpasswd 已存在（管理后台基础认证用，见 /admin 段注释）。
#
# 域名占位符：全文把 mall.example.com 换成你自己的域名，共 6 处。
# ============================================================

# ---- 上游后端 -------------------------------------------------------
# keepalive 只对用户面有意义；mcp/admin 的上游是短连接 + 长连接混用，
# keepalive 开着反而可能撞上上游 keepalive 超时后 nginx 复用半死连接，
# 表现成偶发 502，所以这两条不设 keepalive。
upstream agentmall_web {
    server 127.0.0.1:8000;
    keepalive 16;
}
upstream agentmall_mcp {
    server 127.0.0.1:8001;
}
upstream agentmall_admin {
    server 127.0.0.1:8002;
}

# WebSocket / SSE 升级用；本项目实际用的是长轮询式 SSE，这个 map 仅备用。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- 全局：真实客户端 IP 透传 ---------------------------------------
# 只在有 realip 模块时启用；没有就整段注释掉，否则 nginx -t 报 unknown module。
# set_real_ip_from 需要写**你的**公网出口 IP/网段，不能照抄 127.0.0.1。
#set_real_ip_from 127.0.0.1;
#real_ip_header X-Forwarded-For;
#real_ip_recursive on;

server_tokens off;   # 不回显 nginx 版本号


# ====================================================================
# HTTP :80 —— 只做两件事：放行 ACME 校验，其余全部跳 HTTPS
# ====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name mall.example.com;

    # certbot webroot 续签要能走明文 80，**不能**整站 301 到 https，
    # 否则续签会失败（这是 HTTPS 上线最常见的"证书三个月后过期"原因）。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 健康检查走明文 http（监控组件没配 TLS 时可用），且**不写日志**免得刷屏
    location = /healthz {
        access_log off;
        proxy_pass http://agentmall_web/healthz;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ====================================================================
# HTTPS :443 —— 生产主入口
# ====================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mall.example.com;

    # --- 证书位 ---------------------------------------------------
    # Let's Encrypt（certbot）：
    #   sudo certbot certonly --webroot -w /var/www/html -d mall.example.com
    # 云厂商/自签：直接替换成 .crt / .key 的绝对路径。
    # 拼接证书链（fullchain.pem）而不是单独 certificate.pem，
    # 否则部分客户端（Android/微信）会报"证书链不完整"。
    ssl_certificate     /etc/letsencrypt/live/mall.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mall.example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;        # TLS1.3 下交给客户端选更优
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling：浏览器本地查吊销状态，省一次 RTT，也避免 CA 故障时整站打不开
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver_timeout 5s;

    # 订单/商品体积很小，但给够余量，免得以后传图直接 413
    client_max_body_size 20m;
    client_body_timeout 30s;

    # --- 安全响应头 ------------------------------------------------
    # （下面 add_header 是"每条指令单独覆盖"的语义：location 里只要再出现一次
    #   add_header，server 级这一组就全部失效。改的时候注意这点。）
    add_header Strict-Transport-Security "max-age=31536000" always;   # HSTS，确认 HTTPS 稳定后再开
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # /healthz 直连后端，不带任何业务头
    location = /healthz {
        access_log off;
        proxy_pass http://agentmall_web/healthz;
        proxy_set_header Host $host;
    }

    # ----------------------------------------------------------------
    # ① MCP（streamable-http）：AI 智能体按 URL + Bearer key 接入
    # ----------------------------------------------------------------
    # ⚠️⚠️ 这是整套配置里最容易踩坑的一段，务必逐条看懂再删 ⚠️⚠️
    #
    # MCP streamable-http 的 GET 是 **SSE 长连接**（text/event-stream，服务器靠
    # 持续推送心跳维持会话），POST 是 JSON-RPC 请求。如果沿用普通站点的反代配置，
    # 会出现两个必踩的坑：
    #   坑 1「智能体连不上，一直转圈 / 调用超时」：
    #        proxy_buffering 默认 on，nginx 会把上游的流先攒进缓冲区再吐给客户端，
    #        SSE 心跳被攒住不发 → 客户端判定超时断开。
    #        **proxy_buffering off 是必须的，不是优化项。**
    #   坑 2「连上了但几十秒后自己断」：
    #        proxy_read_timeout 默认 60s，SSE 空闲超过 60s 就被 nginx 掐断。
    #        **要调到 3600s 起步。**
    # 另外还有两个配套项：
    #   proxy_request_buffering off —— 请求体也不缓冲，大 JSON-RPC 直接流给上游；
    #   gzip off —— gzip 会把 SSE 攒进压缩缓冲区，等价于重新引入缓冲；
    #   proxy_http_version 1.1 —— HTTP/1.0 不支持 chunked 与长连接，必须显式指定。
    #
    # 冒烟验证（应看到 {"ok":true,"service":"agentmall-mcp",...}）：
    #   curl -s https://mall.example.com/mcp -o /dev/null -w '%{http_code}\n'
    #   curl -s https://mall.example.com/mcp/whoami -H 'Authorization: Bearer uk_demo_user_secret'
    location = /mcp {
        proxy_pass http://agentmall_mcp;          # 不带结尾斜杠：原样保留 /mcp 路径
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_http_version 1.1;
        # 显式透传 Authorization。nginx 默认会转发客户端的 Authorization，
        # 这里再写一遍是**为了可读性与防呆**：将来有人在这段塞了
        # proxy_set_header 覆盖型指令时，这行能提醒他 key 还得留着。
        # MCP 的 Bearer key 决定调用方角色（user/merchant/admin），丢了就退化成匿名。
        proxy_set_header Authorization $http_authorization;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;

        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;   # ← SSE 长连接：别改回 60s
        proxy_send_timeout    3600s;
    }

    # ----------------------------------------------------------------
    # ② 管理后台（/admin）
    # ----------------------------------------------------------------
    # 为什么必须加 auth_basic：
    #   admin_app.py 目前的登录形态是"登录页里填管理员 key，key 存 cookie"。
    #   它的默认 key 是硬编码在代码里的演示值 ak_demo_admin_secret，
    #   登录页还会把它当 demo 提示直接回显给访客——**等于把钥匙挂在门上**。
    #   在补上独立账号体系（独立口令哈希 / 登录失败锁定 / 二次验证）之前，
    #   公网入口必须先用 nginx 基础认证挡一层，htpasswd 里的口令自己掌握在服务器上。
    #   基础认证只保护入口这一层，应用层的 admin key 校验仍然生效（双保险，不是替代）。
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        auth_basic           "AgentMall Admin (restricted)";
        auth_basic_user_file /etc/nginx/.htpasswd;
        # 生成：sudo htpasswd -c /etc/nginx/.htpasswd opsadmin   （-c 只在首次用！）
        # 追加：sudo htpasswd    /etc/nginx/.htpasswd another
        # 注意：文件建好后要 sudo chmod 640 && sudo chown root:www-data，
        #       nginx worker 以 www-data 身份读，nginx master 以 root 读。
        #       **文件不存在不会让 nginx -t 失败，而是访问时返回 500**，
        #       「登录框一直转圈/500」先查这个文件。

        # 去掉 /admin 前缀再转给后端：后端只认 / 、/orders、/products、
        # /audit、/login、/logout 这些根路径。
        proxy_pass http://agentmall_admin/;
        include /etc/nginx/snippets/proxy_common.conf;

        # ── 前缀问题：已在应用层解决，这里**不要**再用 sub_filter ──
        # 历史：管理后台模板曾用根绝对路径（href="/orders"），直接暴露在 /admin/ 下
        # 会跳到用户面的同名路由（用户面确实有 /orders、/login），后台一点就"跳到买家页面"。
        # 当时用 proxy_redirect + sub_filter 在 nginx 层硬改 HTML 补救——那是治标，
        # 而且**和现在的应用层方案会互相打架**：sub_filter 'href="/' → 'href="/admin/'
        # 会把应用已经生成的 /admin/orders 改写成 /admin/admin/orders（双前缀，点一下就 404）。
        #
        # 现在 admin_app.py 支持 AGENTMALL_ADMIN_BASE_PATH，模板自己生成 /admin/... 链接，
        # 代理链路上少一层字符串改写，更稳也更省流量。**部署时务必设这个环境变量**：
        #   web     service: AGENTMALL_ADMIN_BASE_PATH: "/admin"
        #   systemd : 写进 EnvironmentFile
        # 不设的话后台链接会退回根路径，仍然会跳到用户面（功能上"能用"但是错的页面）。
        # 核对方法：curl 后台首页，grep 出来的 href 应当都是 /admin/ 开头。
        #
        # 若坚持用 sub_filter 方案（不设 BASE_PATH），那么**只能二者选一**，
        # 绝不能同时开——否则双前缀。

        # 把后端种下的 admin key cookie 收窄到 /admin/ 路径，
        # 避免这个管理员凭据被带去访问用户面其它路径；同时强制 Secure。
        proxy_cookie_path  / /admin/;
        proxy_cookie_flags ~ secure httponly samesite=lax;
    }

    # ----------------------------------------------------------------
    # ③ 用户面（其余全部路径）
    # ----------------------------------------------------------------
    # 注意 /admin/ 与 /mcp 都带 ^~ / = 精确匹配，优先级高于这里的 /，
    # 所以它们不会被这一段截走。
    location / {
        proxy_pass http://agentmall_web;
        include /etc/nginx/snippets/proxy_common.conf;

        # 用户面商品图是外链，直接透传，不做本地缓存
        proxy_read_timeout 60s;
    }
}


# ====================================================================
# 附：公网 snippet（部署时复制到 /etc/nginx/snippets/proxy_common.conf）
#     nginx 默认不带 snippets 目录，需要自己建：
#         sudo mkdir -p /etc/nginx/snippets
# ====================================================================
#
# ---- /etc/nginx/snippets/proxy_common.conf ----
#
# proxy_http_version 1.1;
# proxy_set_header Host              $host;
# proxy_set_header X-Real-IP         $remote_addr;
# proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# proxy_set_header X-Forwarded-Proto $scheme;
# proxy_set_header X-Forwarded-Host  $host;
# proxy_set_header Connection        "";
# proxy_connect_timeout 5s;
# proxy_send_timeout    60s;
# proxy_read_timeout    60s;
# proxy_next_upstream   error timeout http_502 http_503;
#
# ---- 安全组/防火墙（比 nginx 更靠前的一道）----
# 只放 80/443。8000/8001/8002 **一律不对公网开放**：
#   · 8001 直连会绕过 proxy_buffering off，SSE 必断；
#   · 8002 绕过 auth_basic，后台裸奔。
#   · 8000/8002 的 uvicorn 绑定地址在代码里写死 0.0.0.0（http_server.py /
#     admin_app.py 的 main()），改不掉，只能靠防火墙兜。
